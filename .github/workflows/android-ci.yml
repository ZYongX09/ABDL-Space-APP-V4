name: Android CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install compile SDK and build tools
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Unit and host-side Compose tests
        run: ./gradlew testDebugUnitTest --no-daemon --console=plain --stacktrace

      - name: Build development and instrumentation APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --console=plain --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            **/build/test-results/testDebugUnitTest/*.xml
            **/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 7

      # CI uses debug credentials only. Official-signature test delivery remains a local release build.
      - name: Upload CI-only development APKs
        uses: actions/upload-artifact@v4
        with:
          name: ci-development-apks-not-release-delivery
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 7
